name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {} # Run from a submitted* tag to roll production back to that commit.

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  LC_ALL: C.UTF-8
  FC_RUNS: "100"

jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      vite_base: ${{ steps.b.outputs.vite_base }}
      site_url: ${{ steps.b.outputs.site_url }}
    steps:
      - name: Compute base path and site URL
        id: b
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR" ]; then path="/$REPO_NAME/pr-preview/pr-$PR/"; else path="/$REPO_NAME/"; fi
          echo "vite_base=$path" >> "$GITHUB_OUTPUT"
          echo "site_url=https://${OWNER,,}.github.io$path" >> "$GITHUB_OUTPUT"

  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          advanced-security: false
      - name: zghalint
        uses: watany-dev/zghalint@83188550edee2d9b3f219a76ecd8848c004adcf8 # v0.0.3
        with:
          paths: .github/workflows/*.yml
          format: github
          offline: "true"

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - name: Repository checks
        run: npm run verify
      - name: Format, lint and type check (Oxfmt, Oxlint, TypeScript 7)
        run: vp check
      - name: Unused files, exports and dependencies (knip)
        run: npm run knip
      - name: Registry signatures and provenance of installed packages
        run: npm audit signatures
      - name: Known high or critical advisories in shipped dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Shell scripts (ShellCheck 0.11.0)
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt
          koalaman/shellcheck@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d
          scripts/*.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - name: Tests with coverage (fails below 95%, see `test` in vite.config.ts)
        run: npm test
      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const rows = ["lines", "statements", "functions", "branches"].map((k) => `| ${k} | ${t[k].pct}% |`);
            console.log(["### Coverage (min 95%)", "", "| metric | covered |", "|---|---|", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep 1.178.0 (p/default rules, fails on any finding)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
          semgrep scan --config p/default --error --metrics=off --sarif-output=semgrep.sarif
      # Code scanning needs a public repository (or GitHub Advanced Security); the scan above
      # gates either way.
      - name: Upload SARIF to code scanning
        if: always() && !github.event.repository.private
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - name: Mutation tests (fails on any surviving mutant, see stryker.config.json)
        run: npm run mutation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation
          path: reports/mutation
          if-no-files-found: ignore

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: false
      - name: Compare benchmarks with the base branch (fails if more than 5% slower)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          npm ci
          base="$RUNNER_TEMP/perf-base"
          git worktree add --detach "$base" "$BASE_SHA"
          if [ -f "$base/vitest.perf.config.ts" ]; then (cd "$base" && npm ci); fi
          node scripts/check-perf.mjs "$base"
      - name: Skip outside pull requests
        if: github.event_name != 'pull_request'
        run: echo "Benchmarks are compared on pull requests only."

  build:
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VITE_BASE: ${{ needs.base.outputs.vite_base }}
      VITE_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - name: Build
        run: vp build
      - name: Size budget
        run: node scripts/check-size.mjs
      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          include-hidden-files: true # keeps .nojekyll

  smoke:
    needs: [base, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VITE_BASE: ${{ needs.base.outputs.vite_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # The key has the runner image version because the .deb files come from that image's mirror.
      - name: Playwright cache key
        id: playwright
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          echo "key=playwright-$RUNNER_OS-$version-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Cache browsers and system packages
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/apt-debs
          key: ${{ steps.playwright.outputs.key }}
      # apt still runs update and checks the hash of every .deb from its signed index, so a stale or
      # tampered file in the cache is downloaded again, not installed.
      - name: Install system packages for browsers
        run: |
          if compgen -G "$HOME/apt-debs/*.deb" > /dev/null; then
            sudo cp "$HOME"/apt-debs/*.deb /var/cache/apt/archives/
          fi
          npx playwright install-deps chromium webkit
      - name: Keep downloaded system packages for the cache
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/apt-debs"
          sudo cp /var/cache/apt/archives/*.deb "$HOME/apt-debs/"
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-debs"
      - name: Install browsers
        run: npx playwright install chromium webkit
      - name: Smoke
        run: npm run smoke
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-report
          path: |
            e2e/screenshots
            playwright-report
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Personal names denylist
        env:
          PII_DENYLIST: ${{ secrets.PII_DENYLIST }}
        run: |
          if [ -z "$PII_DENYLIST" ]; then echo "::warning::PII_DENYLIST is not set"; exit 0; fi
          printf '%s\n' "$PII_DENYLIST" | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/deny.txt"
          if git grep -l -i -F -f "$RUNNER_TEMP/deny.txt" -- . ; then
            echo "::error::The files above contain a denylisted personal name."
            exit 1
          fi

  preview:
    if: github.event_name == 'pull_request'
    needs: [base, actions, static, test, mutation, sast, build, smoke, secrets]
    uses: $/.github/workflows/preview.yml
    with:
      site_url: ${{ needs.base.outputs.site_url }}
    permissions:
      contents: write # push the preview to gh-pages
      pull-requests: write # sticky preview comment
      pages: read # ask whether Pages serves this repository

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/submitted'))
    needs: [base, actions, static, test, mutation, sast, build, smoke, secrets]
    uses: $/.github/workflows/deploy.yml
    with:
      site_url: ${{ needs.base.outputs.site_url }}
    permissions:
      contents: write # push to gh-pages
      issues: write # report a failed production check
      pages: read # ask whether Pages serves this repository
