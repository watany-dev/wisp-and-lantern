name: guard

# Runs the base branch's copy of this file, so a pull request cannot weaken its own gate.
# Never check out or execute pull request code in this workflow.
on:
  # Runs the base branch's copy with a read-only token; no pull request code runs here.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  LC_ALL: C.UTF-8
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  PR: ${{ github.event.pull_request.number }}

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Pull request title and commit messages
        run: |
          set -euo pipefail
          title="$(gh pr view "$PR" --json title --jq .title)"
          if ! grep -Eq '^(feat|fix|chore|docs|test|refactor|perf|ci|build|revert)(\([a-z0-9./-]+\))?!?: [ -~]+$' <<<"$title"; then
            echo "::error::The title must be an English conventional commit, e.g. 'feat(trial-tell): add color cards'."
            exit 1
          fi
          gh api --paginate "repos/$GH_REPO/pulls/$PR/commits" --jq '.[].commit.message' > msgs.txt
          if grep -inE 'claude|anthropic' msgs.txt; then
            echo "::error::Commit messages must not name the scaffold tool vendor."
            exit 1
          fi
          if grep -nP '[\p{Han}\p{Hiragana}\p{Katakana}]' msgs.txt; then
            echo "::error::Commit messages must be English."
            exit 1
          fi
