name: preview

on:
  workflow_call:
    inputs:
      site_url: { type: string, required: true }
  pull_request:
    types: [closed]

permissions: {}

env:
  LC_ALL: C.UTF-8

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push to gh-pages
      pull-requests: write # sticky preview comment
    concurrency:
      group: pages-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Preview action
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: deploy
      # No dependency cache here: this job holds a write token.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: false
          run-install: |
            - args: ['--frozen-lockfile']
      - name: Wait until Pages serves this build
        env:
          URL: ${{ inputs.site_url }}
          SHA: ${{ github.sha }}
        run: bash scripts/wait-for-build.sh "$URL" "$SHA" 900
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Smoke the live preview
        env:
          BASE_URL: ${{ inputs.site_url }}
        run: npm run smoke

  remove:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push to gh-pages
      pull-requests: write # sticky preview comment
    concurrency:
      group: pages-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preview action
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
