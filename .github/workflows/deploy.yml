name: deploy

on:
  workflow_call:
    inputs:
      site_url: { type: string, required: true }

permissions: {}

env:
  LC_ALL: C.UTF-8
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Shows each deploy under Deployments and gives the environment's branch and tag rules
    # (docs/maintainer-setup.md) a place to refuse a deploy from any other ref.
    environment:
      name: production
      url: ${{ inputs.site_url }}
    permissions:
      contents: write # push to gh-pages
      issues: write # report a failed production check
      pages: read # ask whether Pages serves this repository
    concurrency:
      group: pages-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: dist
          branch: gh-pages
          clean: true
          clean-exclude: |
            pr-preview/
      # Without a Pages site (private repository on a plan without Pages, or no Source yet) the
      # wait below can never succeed, so the live checks are skipped with a warning.
      - name: Check that Pages is enabled
        id: pages
        run: bash scripts/pages-enabled.sh
      # No dependency cache here: a cache written by a pull request must not reach a deploy.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        if: steps.pages.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: false
          run-install: |
            - args: ['--frozen-lockfile']
      - name: Wait until Pages serves this build
        if: steps.pages.outputs.enabled == 'true'
        env:
          URL: ${{ inputs.site_url }}
          SHA: ${{ github.sha }}
        run: bash scripts/wait-for-build.sh "$URL" "$SHA" 900
      - name: Install browsers
        if: steps.pages.outputs.enabled == 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Smoke production
        if: steps.pages.outputs.enabled == 'true'
        env:
          BASE_URL: ${{ inputs.site_url }}
        run: npm run smoke
      - name: Report failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/report-failure.sh "Production deploy check failed" production "$RUN_URL"
