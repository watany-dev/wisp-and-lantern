name: nightly

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch: {}

permissions: {}

env:
  LC_ALL: C.UTF-8
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  pbt-deep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write # report a failure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - name: Property tests with many runs and a fresh seed
        run: |
          export FC_RUNS=2000 FC_SEED="$(shuf -i 1-2147483647 -n 1)"
          echo "Reproduce: FC_SEED=$FC_SEED FC_RUNS=2000 vp test run pbt" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "With the fix, add the failure's seed and path to src/domain/__tests__/support/pbt-regressions.json." | tee -a "$GITHUB_STEP_SUMMARY"
          vp test run pbt
      - name: Report failure
        if: failure()
        run: bash scripts/report-failure.sh "Nightly property tests failed" nightly "$RUN_URL"

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # report a failure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - name: Known high or critical advisories in all dependencies, dev tools included
        run: npm audit --audit-level=high
      - name: Report failure
        if: failure()
        run: bash scripts/report-failure.sh "Nightly dependency audit failed" nightly "$RUN_URL"

  # Without a Pages site (private repository on a plan without Pages, or no Source yet) there is
  # nothing to check; liveness is skipped with a warning instead of opening an issue every night.
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read # ask whether Pages serves this repository
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that Pages is enabled
        id: pages
        run: bash scripts/pages-enabled.sh

  liveness:
    needs: pages
    if: needs.pages.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write # report a failure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Expected production build
        id: exp
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          tag="$(git tag --list 'submitted*' --sort=-creatordate | head -n1)"
          if [ -n "$tag" ]; then sha="$(git rev-parse "$tag^{commit}")"; else sha="$(git rev-parse origin/main)"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "url=https://${OWNER,,}.github.io/$REPO_NAME/" >> "$GITHUB_OUTPUT"
          echo "Expecting ${tag:-main} = $sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Production serves the expected build
        env:
          URL: ${{ steps.exp.outputs.url }}
          SHA: ${{ steps.exp.outputs.sha }}
        run: bash scripts/wait-for-build.sh "$URL" "$SHA" 60
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      # The key has the runner image version because the .deb files come from that image's mirror.
      - name: Playwright cache key
        id: playwright
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          echo "key=playwright-$RUNNER_OS-$version-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Cache browsers and system packages
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/apt-debs
          key: ${{ steps.playwright.outputs.key }}
      # apt still runs update and checks the hash of every .deb from its signed index, so a stale or
      # tampered file in the cache is downloaded again, not installed.
      - name: Install system packages for browsers
        run: |
          if compgen -G "$HOME/apt-debs/*.deb" > /dev/null; then
            sudo cp "$HOME"/apt-debs/*.deb /var/cache/apt/archives/
          fi
          npx playwright install-deps chromium webkit
      - name: Keep downloaded system packages for the cache
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/apt-debs"
          sudo cp /var/cache/apt/archives/*.deb "$HOME/apt-debs/"
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-debs"
      - name: Install browsers
        run: npx playwright install chromium webkit
      - name: Smoke production
        env:
          BASE_URL: ${{ steps.exp.outputs.url }}
        run: npm run smoke
      - name: Report failure
        if: failure()
        run: bash scripts/report-failure.sh "Production liveness check failed" liveness "$RUN_URL"
