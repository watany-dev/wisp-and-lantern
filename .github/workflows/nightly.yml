name: nightly

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch: {}

permissions: {}

env:
  LC_ALL: C.UTF-8
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  pbt-deep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write # report a failure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - name: Property tests with many runs and a fresh seed
        run: |
          export FC_RUNS=2000 FC_SEED="$(shuf -i 1-2147483647 -n 1)"
          echo "Reproduce: FC_SEED=$FC_SEED FC_RUNS=2000 vp test run pbt" | tee -a "$GITHUB_STEP_SUMMARY"
          vp test run pbt
      - name: Report failure
        if: failure()
        run: bash scripts/report-failure.sh "Nightly property tests failed" nightly "$RUN_URL"

  liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write # report a failure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Expected production build
        id: exp
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          tag="$(git tag --list 'submitted*' --sort=-creatordate | head -n1)"
          if [ -n "$tag" ]; then sha="$(git rev-parse "$tag^{commit}")"; else sha="$(git rev-parse origin/main)"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "url=https://${OWNER,,}.github.io/$REPO_NAME/" >> "$GITHUB_OUTPUT"
          echo "Expecting ${tag:-main} = $sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Production serves the expected build
        env:
          URL: ${{ steps.exp.outputs.url }}
          SHA: ${{ steps.exp.outputs.sha }}
        run: bash scripts/wait-for-build.sh "$URL" "$SHA" 60
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Smoke production
        env:
          BASE_URL: ${{ steps.exp.outputs.url }}
        run: npm run smoke
      - name: Report failure
        if: failure()
        run: bash scripts/report-failure.sh "Production liveness check failed" liveness "$RUN_URL"
