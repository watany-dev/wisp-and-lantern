<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Wisp &amp; Lantern</title>
    <style>
      /* Relative URL: works at the site root and under /<repo>/pr-preview/pr-<n>/. */
      @font-face {
        font-family: "ZenMaru";
        src: url("assets/fonts/zen-maru-gothic-subset.woff2") format("woff2");
        font-display: block;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        /* The night sky. The canvas is transparent, so the browser paints this once. */
        background: linear-gradient(180deg, #0a0a1a 0%, #1f1340 100%) no-repeat #0a0a1a;
        overscroll-behavior: none;
        touch-action: none;
      }
      #app {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
